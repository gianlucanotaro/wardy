<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option C: Style lines</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --bg:#f3f2f2; --surface:#eae9e9; --ink:#201e1d; --ink-2:#605d5d; --ink-3:#9b9797;
    --line:color-mix(in srgb,#201e1d 30%,transparent); --grid:rgba(32,30,29,.14); --accent:#ec3013; --accent-700:#ae1800; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Archivo",system-ui,sans-serif; }
  main { max-width:430px; margin:0 auto; border-left:1px solid var(--line); border-right:1px solid var(--line); }
  .lbl { font:800 9px "Archivo",sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); }
  .bar { display:flex; justify-content:space-between; align-items:baseline; padding:12px 16px; border-bottom:2px solid var(--ink); }
  .title { font-weight:800; font-size:30px; line-height:36px; letter-spacing:-.025em; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; border-bottom:2px solid var(--ink); }
  .tile { padding:10px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-width:0; }
  .tile:nth-child(2n) { border-right:0; }
  .ph { height:130px; border:1px solid var(--ink); background:var(--surface); overflow:hidden; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .nm { word-spacing:.15em; font-weight:800; font-size:12px; margin-top:6px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase; }
  .cl { font-size:9.5px; color:var(--ink-2); letter-spacing:.03em; text-transform:uppercase; }
  .opt { border-bottom:2px solid var(--ink); }
  .opt-h { display:flex; justify-content:space-between; gap:12px; padding:10px 16px 0; }
  .opt-h b { font:800 11px "Archivo",sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  .plot { padding:8px 16px 0; }
  svg { display:block; width:100%; height:auto; overflow:visible; }
  .tick { font:800 9px "Archivo",sans-serif; letter-spacing:.06em; text-transform:uppercase; fill:var(--ink-3); }
  .tick.on { fill:var(--ink); }
  .val { font:800 11px "Archivo",sans-serif; fill:var(--ink); }
  .hit { fill:transparent; cursor:pointer; }
  .sel { fill:rgba(32,30,29,.07); }
  .read { min-height:44px; padding:8px 16px 12px; font-size:12.5px; line-height:17px; }
  .read b { word-spacing:.12em; font-weight:800; letter-spacing:.02em; text-transform:uppercase; }
  .read span { color:var(--ink-2); }
  /* B: one strip */
  .strip { display:flex; gap:2px; height:14px; margin-top:6px; }
  .seg { border:0; padding:0; background:var(--ink); cursor:pointer; transition:flex-grow .25s ease-out; min-width:3px; }
  .seg.top { background:var(--accent); }
  .names { display:flex; flex-wrap:wrap; gap:3px 12px; margin-top:8px; font-size:11px; }
  .names button { all:unset; cursor:pointer; font:800 10px "Archivo",sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); padding:3px 0; }
  .names button[data-top] { color:var(--ink); }
  .names i { font-style:normal; font-weight:600; color:var(--ink-2); margin-left:4px; }
  /* C: one line per style */
  .rows { display:grid; gap:0; margin-top:4px; }
  .row { all:unset; display:grid; grid-template-columns:96px 1fr 34px; gap:10px; align-items:center; height:30px; cursor:pointer; }
  .row[data-empty] { visibility:hidden; }
  .row .n { font:800 10px "Archivo",sans-serif; letter-spacing:.06em; text-transform:uppercase; }
  .row .t { position:relative; height:1px; background:var(--grid); }
  .row .f { position:absolute; left:0; top:-1px; height:3px; background:var(--ink); transition:width .25s ease-out; }
  .row[data-top] .f { background:var(--accent); }
  .row .p { font:800 11px "Archivo",sans-serif; text-align:right; }
  button:focus-visible, .row:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .acts { display:grid; grid-template-columns:repeat(3,1fr); }
  .act { word-spacing:.12em; border:0; min-height:52px; padding:12px; font:800 12px "Archivo",sans-serif; letter-spacing:.06em; text-align:left; background:var(--bg); color:var(--ink); cursor:pointer; }
  .act+.act { border-left:2px solid var(--ink); }
  .act.p { background:var(--accent); color:var(--bg); cursor:default; }
  .act.n:hover { background:rgba(32,30,29,.07); }
  .note { padding:10px 16px 14px; font-size:12px; line-height:17px; color:var(--ink-2); border-top:2px solid var(--ink); }
section.opt:nth-of-type(1){display:none}section.opt:nth-of-type(2){display:none}</style>
</head>
<body>
<main>
  <div class="bar"><span class="title">TODAY</span><span class="lbl">OPTION C · OUTFIT <span id="idx"></span></span></div>
  <div class="tiles" id="tiles"></div>

  <section class="opt">
    <div class="opt-h"><b>Style</b></div>
    <div class="plot"><svg id="line" viewBox="0 0 360 176" role="img" aria-label="Style line"></svg></div>
    <div class="read" id="read-a"></div>
  </section>

  <section class="opt">
    <div class="opt-h"><b>Style</b></div>
    <div class="plot"><div class="strip" id="strip"></div><div class="names" id="names"></div></div>
    <div class="read" id="read-b"></div>
  </section>

  <section class="opt">
    <div class="opt-h"><b>Style</b></div>
    <div class="plot"><div class="rows" id="rows"></div></div>
    <div class="read" id="read-c"></div>
  </section>

  <div class="acts">
    <button class="act p" type="button" tabindex="-1">LOG AS WORN</button>
    <button class="act" type="button" tabindex="-1">SAVE AS LOOK</button>
    <button class="act n" type="button" id="next">NOT TODAY →</button>
  </div>
  <div class="note">Option C: Style lines. Tap NOT TODAY to see other outfits, and tap the chart for the pieces behind it. Styles here are hand-picked for the demo.</div>
</main>

const AXES = [['minimal',['minimal']],['classic',['classic','preppy']],['smart-casual',['smart-casual']],['streetwear',['streetwear']],['sporty',['sporty']],['workwear',['workwear']],['edgy',['edgy','avant-garde']],['romantic',['romantic','bohemian']],['vintage',['vintage']]];
let oi = 0, picked = null, peak = 0;
const isTop = s => s.pct > 0 && Math.abs(s.pct - peak) < 0.01;

function compute(items) {
  const counts = AXES.map(() => 0), who = AXES.map(() => new Set());
  let total = 0;
  for (const it of items) for (const s of it.styles) {
    const a = AXES.findIndex(x => x[1].includes(s));
    if (a < 0) continue;
    counts[a]++; total++; who[a].add(it.name);
  }
  return AXES.map((x, i) => ({ i, name: x[0], pct: total ? counts[i] / total * 100 : 0, who: [...who[i]] }));
}
const el = (s, a = {}) => { const e = document.createElementNS('http://www.w3.org/2000/svg', s); for (const k in a) e.setAttribute(k, a[k]); return e; };
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

function readout(id, d, top) {
  const r = document.getElementById(id); r.textContent = '';
  if (picked != null) {
    const s = d[picked];
    r.append(h('b', '', s.name + ' ' + Math.round(s.pct) + '%'), h('span', '', s.who.length ? ' · ' + s.who.join(', ') : ' · no piece in this outfit'));
    return;
  }
  const tops = d.filter(isTop);
  if (tops.length > 1) {
    r.append(h('b', '', 'A mix: ' + tops.map(s => s.name).join(', ')), h('span', '', ' · ' + Math.round(peak) + '% each'));
  } else {
    r.append(h('b', '', 'Mostly ' + top.name + ' ' + Math.round(top.pct) + '%'), h('span', '', ' · ' + top.who.join(', ')));
  }
}
function pick(i) { picked = picked === i ? null : i; render(); }

function renderLine(d, top) {
  const svg = document.getElementById('line'); svg.textContent = '';
  const L = 36, R = 352, T = 18, B = 104, step = (R - L) / (d.length - 1);
  const max = Math.max(60, top.pct);
  const X = i => L + i * step, Y = p => B - (p / max) * (B - T);
  if (picked != null) svg.append(el('rect', { class: 'sel', x: X(picked) - step / 2, y: 0, width: step, height: 176 }));
  svg.append(el('line', { x1: L, x2: R, y1: B, y2: B, stroke: '#201e1d', 'stroke-width': 2 }));
  svg.append(el('polyline', { points: d.map(s => X(s.i) + ',' + Y(s.pct)).join(' '), fill: 'none', stroke: '#ec3013', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
  d.forEach(s => {
    const on = s.pct > 0;
    if (on) svg.append(el('circle', { cx: X(s.i), cy: Y(s.pct), r: 4.5, fill: '#ec3013', stroke: '#f3f2f2', 'stroke-width': 2 }));
    else svg.append(el('line', { x1: X(s.i), x2: X(s.i), y1: B - 3, y2: B + 3, stroke: '#201e1d', 'stroke-width': 1 }));
    const t = el('text', { class: 'tick' + (on ? ' on' : ''), 'text-anchor': 'end', transform: `translate(${X(s.i) + 3},${B + 14}) rotate(-40)` });
    t.textContent = s.name; svg.append(t);
    if (isTop(s) || s.i === picked) {
      const v = el('text', { class: 'val', x: Math.min(X(s.i), 342), y: Y(s.pct) - 9, 'text-anchor': 'middle' });
      v.textContent = Math.round(s.pct) + '%'; svg.append(v);
    }
    const hit = el('rect', { class: 'hit', x: X(s.i) - step / 2, y: 0, width: step, height: 176 });
    hit.addEventListener('click', () => pick(s.i)); svg.append(hit);
  });
}
function renderStrip(d, top) {
  const strip = document.getElementById('strip'), names = document.getElementById('names');
  strip.textContent = ''; names.textContent = '';
  d.filter(s => s.pct > 0).sort((a, b) => b.pct - a.pct).forEach(s => {
    const seg = h('button', 'seg' + (isTop(s) ? ' top' : '')); seg.type = 'button';
    seg.style.flexGrow = s.pct; seg.setAttribute('aria-label', s.name + ' ' + Math.round(s.pct) + '%');
    seg.addEventListener('click', () => pick(s.i)); strip.append(seg);
    const n = h('button', '', s.name); n.type = 'button';
    if (isTop(s)) n.dataset.top = '1';
    n.append(h('i', '', Math.round(s.pct) + '%'));
    n.addEventListener('click', () => pick(s.i)); names.append(n);
  });
}
function renderRows(d, top) {
  const rows = document.getElementById('rows'); rows.textContent = '';
  const list = d.filter(s => s.pct > 0).sort((a, b) => b.pct - a.pct).slice(0, 4);
  for (let k = 0; k < 4; k++) {
    const s = list[k], r = h('button', 'row'); r.type = 'button';
    if (!s) { r.dataset.empty = '1'; r.tabIndex = -1; rows.append(r); continue; }
    if (isTop(s)) r.dataset.top = '1';
    const t = h('span', 't'), f = h('span', 'f'); f.style.width = s.pct + '%'; t.append(f);
    r.append(h('span', 'n', s.name), t, h('span', 'p', Math.round(s.pct) + '%'));
    r.addEventListener('click', () => pick(s.i)); rows.append(r);
  }
}
function render() {
  const items = OUTFITS[oi];
  const tiles = document.getElementById('tiles'); tiles.textContent = '';
  items.forEach(it => {
    const t = h('div', 'tile'), p = h('div', 'ph'), img = document.createElement('img');
    img.src = it.src; img.alt = it.name; p.append(img);
    t.append(p, h('div', 'nm', it.name), h('div', 'cl', it.color)); tiles.append(t);
  });
  document.getElementById('idx').textContent = (oi + 1) + '/' + OUTFITS.length;
  const d = compute(items), top = d.reduce((a, b) => b.pct > a.pct ? b : a);
  peak = top.pct;
  renderLine(d, top); renderStrip(d, top); renderRows(d, top);
  ['read-a', 'read-b', 'read-c'].forEach(id => readout(id, d, top));
}
document.getElementById('next').addEventListener('click', () => { oi = (oi + 1) % OUTFITS.length; picked = null; render(); });
render();
</script>
