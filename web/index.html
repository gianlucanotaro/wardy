<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Zoom is disabled on purpose: this is an app, not a document. iOS
         Safari ignores user-scalable=no, so index.css (touch-action) and
         main.tsx (gesturestart) cover it there. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f1ece2" />
    <!-- Light or dark, before first paint so there is no flash. Same rule as
         src/theme.ts: the saved choice, else the phone's setting. -->
    <script>
      try {
        var p = localStorage.getItem('wardy-theme')
        var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <!-- iOS doesn't fully honor the web manifest for "Add to Home Screen" —
         these are the standard companions Safari actually reads. -->
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Wardy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
