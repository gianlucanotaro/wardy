<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cut-out test</title>
<!-- PROTOTYPE, not part of the app. Tries background removal on this device:
     ISNet (MIT licence) through onnxruntime-web (MIT). Nothing is uploaded:
     the photo stays on the phone. The runtime comes from jsDelivr, the
     small model from IMG.LY's public CDN, the full model from Hugging Face. -->
<style>
  :root { color-scheme: light dark; font: 16px/1.4 system-ui, sans-serif; }
  body { margin: 16px auto; max-width: 640px; padding: 0 16px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.03em; }
  p, label, select, button, input { font: inherit; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  button { min-height: 44px; padding: 0 20px; border: 2px solid currentColor; border-radius: 99px; background: none; font-weight: 700; }
  button.go { background: #ec3013; border-color: #ec3013; color: #fff; }
  button:disabled { opacity: .5; }
  select { min-height: 44px; }
  pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; background: color-mix(in srgb, currentColor 8%, transparent); padding: 12px; margin: 12px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { position: relative; aspect-ratio: 3 / 4; overflow: hidden; }
  .tile canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  .yellow { background: #f4b400; }
  .check { background: conic-gradient(#ccc 25%, #fff 0 50%, #ccc 0 75%, #fff 0) 0 0 / 20px 20px; }
  .tile span { position: absolute; left: 6px; top: 6px; font-size: 12px; font-weight: 700; background: #fff; color: #000; padding: 1px 8px; border-radius: 99px; }
  a#save { display: inline-block; margin: 8px 0; }
</style>
</head>
<body>
<h1>cut-out test</h1>
<p>Pick a garment photo. It is cut out on this phone and nothing is uploaded.</p>

<div class="row">
  <label>model
    <select id="model">
      <option value="quint8">small · 44 MB download</option>
      <option value="fp32">full · 176 MB download</option>
    </select>
  </label>
  <input id="file" type="file" accept="image/*">
</div>
<div class="row"><button class="go" id="go" disabled>cut out</button></div>

<pre id="log">loading…</pre>

<div class="grid">
  <div class="tile"><span>photo</span><canvas id="orig"></canvas></div>
  <div class="tile yellow"><span>on a block</span><canvas id="onBlock"></canvas></div>
  <div class="tile check" style="grid-column: span 2; aspect-ratio: 4 / 3"><span>transparent</span><canvas id="onCheck"></canvas></div>
</div>
<a id="save" download="cutout.png" hidden>save the PNG</a>

<script type="module">
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/'
const IMGLY = 'https://staticimgly.com/@imgly/background-removal-data/1.7.0/dist/'
const FULL = 'https://huggingface.co/imgly/isnet-general-onnx/resolve/main/onnx/model.onnx'
const S = 1024
const MEAN = [0.485, 0.456, 0.406]
const $ = (id) => document.getElementById(id)
const logEl = $('log')
const lines = []
const log = (t) => { lines.push(t); logEl.textContent = lines.join('\n') }
const setLast = (t) => { lines[lines.length - 1] = t; logEl.textContent = lines.join('\n') }
const ms = (t0) => Math.round(performance.now() - t0) + ' ms'

let ort, session, loadedKind = null
let bitmap = null

// Device facts, so the numbers mean something.
function deviceInfo() {
  log('device: ' + navigator.userAgent)
  log(`cores ${navigator.hardwareConcurrency || '?'} · memory ${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'n/a'} · isolated ${crossOriginIsolated} · webgpu ${'gpu' in navigator}`)
}

async function fetchBytes(url, total, label) {
  const res = await fetch(url)
  if (!res.ok) throw new Error(url + ' ' + res.status)
  const size = total || +res.headers.get('content-length') || 0
  const out = size ? new Uint8Array(size) : null
  const parts = []
  let got = 0
  const reader = res.body.getReader()
  for (;;) {
    const { done, value } = await reader.read()
    if (done) break
    if (out) out.set(value, got)
    else parts.push(value)
    got += value.length
    setLast(`${label}: ${(got / 1e6).toFixed(1)} / ${(size / 1e6).toFixed(0)} MB`)
  }
  return out || new Uint8Array(await new Blob(parts).arrayBuffer())
}

async function loadModel(kind) {
  if (loadedKind === kind) return
  const t0 = performance.now()
  if (!ort) {
    ort = await import(ORT + 'ort.wasm.min.mjs')
    ort.env.wasm.wasmPaths = ORT
    ort.env.wasm.numThreads = crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1
  }
  let bytes
  if (kind === 'fp32') {
    log('')
    bytes = await fetchBytes(FULL, 176149806, 'downloading')
  } else {
    const res = await (await fetch(IMGLY + 'resources.json')).json()
    const entry = res['/models/isnet_quint8']
    bytes = new Uint8Array(entry.size)
    let got = 0
    log('')
    for (const c of entry.chunks) {
      const part = await (await fetch(IMGLY + c.name)).arrayBuffer()
      bytes.set(new Uint8Array(part), c.offsets[0])
      got += part.byteLength
      setLast(`downloading: ${(got / 1e6).toFixed(1)} / ${(entry.size / 1e6).toFixed(0)} MB`)
    }
  }
  const tDl = performance.now() - t0
  setLast(`download ${Math.round(tDl)} ms (cached by the browser next time)`)
  const t1 = performance.now()
  session = await ort.InferenceSession.create(bytes, { executionProviders: ['wasm'], graphOptimizationLevel: 'all' })
  log(`model ready in ${ms(t1)} · threads ${ort.env.wasm.numThreads}`)
  loadedKind = kind
}

// The garment is the biggest blob: drop speckle everywhere else.
function cleanMask(a) {
  const n = S * S
  const labels = new Int32Array(n)
  const stack = new Int32Array(n)
  let best = 0, bestSize = 0, next = 0
  for (let start = 0; start < n; start++) {
    if (a[start] <= 0.5 || labels[start]) continue
    next++
    let size = 0, sp = 0
    stack[sp++] = start
    labels[start] = next
    while (sp) {
      const p = stack[--sp]
      size++
      const x = p % S, y = (p / S) | 0
      if (x > 0 && a[p - 1] > 0.5 && !labels[p - 1]) { labels[p - 1] = next; stack[sp++] = p - 1 }
      if (x < S - 1 && a[p + 1] > 0.5 && !labels[p + 1]) { labels[p + 1] = next; stack[sp++] = p + 1 }
      if (y > 0 && a[p - S] > 0.5 && !labels[p - S]) { labels[p - S] = next; stack[sp++] = p - S }
      if (y < S - 1 && a[p + S] > 0.5 && !labels[p + S]) { labels[p + S] = next; stack[sp++] = p + S }
    }
    if (size > bestSize) { bestSize = size; best = next }
  }
  if (bestSize < n * 0.02) return a // nothing garment-sized found: leave the mask alone
  // keep the main blob, plus a margin so soft edges survive
  const R = 8
  const keep = new Uint8Array(n)
  for (let i = 0; i < n; i++) keep[i] = labels[i] === best ? 1 : 0
  const tmp = new Uint8Array(n), out = new Uint8Array(n)
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let v = 0
    for (let k = Math.max(0, x - R); k <= Math.min(S - 1, x + R) && !v; k++) v = keep[y * S + k]
    tmp[y * S + x] = v
  }
  for (let x = 0; x < S; x++) for (let y = 0; y < S; y++) {
    let v = 0
    for (let k = Math.max(0, y - R); k <= Math.min(S - 1, y + R) && !v; k++) v = tmp[k * S + x]
    out[y * S + x] = v
  }
  // holes inside the garment (a pale garment on a pale wall) are part of it:
  // whatever the border can't reach without crossing the blob is filled in
  const outside = new Uint8Array(n)
  let sp = 0
  const push = (p) => { if (!keep[p] && !outside[p]) { outside[p] = 1; stack[sp++] = p } }
  for (let x = 0; x < S; x++) { push(x); push((S - 1) * S + x) }
  for (let y = 0; y < S; y++) { push(y * S); push(y * S + S - 1) }
  while (sp) {
    const p = stack[--sp]
    const x = p % S, y = (p / S) | 0
    if (x > 0) push(p - 1)
    if (x < S - 1) push(p + 1)
    if (y > 0) push(p - S)
    if (y < S - 1) push(p + S)
  }
  const res = new Float32Array(n)
  for (let i = 0; i < n; i++) res[i] = !outside[i] ? 1 : out[i] ? a[i] : 0
  return res
}

async function cutOut() {
  const kind = $('model').value
  $('go').disabled = true
  try {
    await loadModel(kind)
    const T = performance.now()
    // the photo at display size (the app stores 1600px at most)
    const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height))
    const W = Math.round(bitmap.width * scale), H = Math.round(bitmap.height * scale)
    const photo = new OffscreenCanvas(W, H)
    photo.getContext('2d').drawImage(bitmap, 0, 0, W, H)

    const t1 = performance.now()
    const small = new OffscreenCanvas(S, S)
    const sg = small.getContext('2d', { willReadFrequently: true })
    sg.drawImage(bitmap, 0, 0, S, S)
    const px = sg.getImageData(0, 0, S, S).data
    let max = 1e-6
    for (let i = 0; i < px.length; i += 4) max = Math.max(max, px[i], px[i + 1], px[i + 2])
    const data = new Float32Array(3 * S * S)
    for (let i = 0; i < S * S; i++) for (let c = 0; c < 3; c++) data[c * S * S + i] = px[i * 4 + c] / max - MEAN[c]
    const input = new ort.Tensor('float32', data, [1, 3, S, S])
    const tPre = performance.now() - t1

    const t2 = performance.now()
    const out = await session.run({ [session.inputNames[0]]: input })
    const tRun = performance.now() - t2

    const t3 = performance.now()
    const m = out[session.outputNames[0]].data
    let mn = Infinity, mx = -Infinity
    for (let i = 0; i < S * S; i++) { if (m[i] < mn) mn = m[i]; if (m[i] > mx) mx = m[i] }
    const a = new Float32Array(S * S)
    for (let i = 0; i < S * S; i++) a[i] = (m[i] - mn) / (mx - mn)
    const clean = cleanMask(a)
    // mask -> a canvas, scaled to the photo's size for soft edges
    const mc = new OffscreenCanvas(S, S), mg = mc.getContext('2d')
    const mi = mg.createImageData(S, S)
    for (let i = 0; i < S * S; i++) { const v = Math.round(clean[i] * 255); mi.data[i * 4] = v; mi.data[i * 4 + 1] = v; mi.data[i * 4 + 2] = v; mi.data[i * 4 + 3] = 255 }
    mg.putImageData(mi, 0, 0)
    const big = new OffscreenCanvas(W, H), bg = big.getContext('2d', { willReadFrequently: true })
    bg.drawImage(mc, 0, 0, W, H)
    const alpha = bg.getImageData(0, 0, W, H).data
    const pg = photo.getContext('2d', { willReadFrequently: true })
    const img = pg.getImageData(0, 0, W, H)
    for (let i = 0; i < W * H; i++) img.data[i * 4 + 3] = alpha[i * 4]
    pg.putImageData(img, 0, 0)
    const tPost = performance.now() - t3

    for (const id of ['onBlock', 'onCheck']) {
      const c = $(id); c.width = W; c.height = H
      c.getContext('2d').drawImage(photo, 0, 0)
    }
    const blob = await photo.convertToBlob({ type: 'image/png' })
    $('save').href = URL.createObjectURL(blob)
    $('save').hidden = false
    $('save').textContent = `save the PNG (${(blob.size / 1e6).toFixed(1)} MB, ${W}×${H})`
    log(`photo ${bitmap.width}×${bitmap.height} → ${W}×${H}`)
    log(`prepare ${Math.round(tPre)} ms · model ${Math.round(tRun)} ms · clean-up ${Math.round(tPost)} ms · total ${ms(T)}`)
    if (performance.memory) log(`JS heap ${(performance.memory.usedJSHeapSize / 1e6).toFixed(0)} MB (wasm memory not included)`)
    log('run it again: the second run is the warm speed.')
  } catch (e) {
    log('FAILED: ' + (e && e.message ? e.message : e))
  } finally {
    $('go').disabled = false
  }
}

$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0]
  if (!f) return
  bitmap = await createImageBitmap(f, { imageOrientation: 'from-image' })
  const c = $('orig'); c.width = bitmap.width; c.height = bitmap.height
  c.getContext('2d').drawImage(bitmap, 0, 0)
  $('go').disabled = false
  log(`picked ${f.name || 'photo'} (${(f.size / 1e6).toFixed(1)} MB)`)
})
$('go').addEventListener('click', cutOut)
logEl.textContent = ''
deviceInfo()
log('pick a photo, then "cut out". The first run downloads the model.')
</script>
</body>
</html>
