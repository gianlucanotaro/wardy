<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The Wardy app icon: a W whose middle peak carries a hanger hook.
       icon-192/512.png are this, rendered; icon-maskable-512.png is the same
       mark at 0.74 scale so Android's circle crop keeps it whole. -->
  <rect width="512" height="512" fill="#ec3013"/>
  <g transform="translate(256 256) scale(0.92) translate(-256 -272)" stroke="#f3f2f2" fill="none">
    <clipPath id="w"><rect x="0" y="180" width="512" height="332"/></clipPath>
    <path clip-path="url(#w)" d="M70 134 L172 392 L256 256 L340 392 L442 134" stroke-width="58" stroke-miterlimit="10"/>
    <path d="M256 250 V146 a32 32 0 0 1 64 0 v16" stroke-width="24"/>
  </g>
</svg>
